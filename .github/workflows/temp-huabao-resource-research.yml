name: TEMP Huabao resource exact daily research
on:
  push:
    branches:
      - research/huabao-resource-20260923
    paths:
      - research/huabao_resource_20260923.py
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/huabao-resource-20260923
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install fonts and dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install -U pip
          pip install pandas numpy matplotlib requests openpyxl akshare scipy
      - name: Run exact daily research
        run: python research/huabao_resource_20260923.py
      - name: Commit outputs to research branch
        run: |
          git config user.name "chatgpt-research"
          git config user.email "chatgpt-research@users.noreply.github.com"
          git add research/output_huabao_20260923
          git commit -m "Research output: Huabao exact daily analysis" || exit 0
          git push origin HEAD:research/huabao-resource-20260923
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: huabao-resource-exact-daily
          path: research/output_huabao_20260923
          if-no-files-found: error
